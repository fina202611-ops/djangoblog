<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DjangoBlog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>
        <div>
            {% if request.user.is_authenticated %}
                <!-- 👇 Добавлена ссылка на My Posts -->
                <a class="btn btn-outline-light btn-sm" href="{% url 'my_posts' %}">My Posts</a>
                <a class="btn btn-outline-light btn-sm ms-1" href="{% url 'post_create' %}">New Post</a>
                <span class="text-white ms-2">Hi, {{ request.user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm ms-2">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
                <a class="btn btn-outline-light btn-sm ms-1" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
