{% extends "blog/base.html" %}
{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>{{ post.title }}</h1>
  
  {% if post.category %}
    <span class="badge bg-secondary">{{ post.category.name }}</span>
  {% endif %}

  <p class="text-muted mt-2">{{ post.created_at|date:"M d, Y" }}</p>
  <p>{{ post.content }}</p>

  <!-- 👇 Добавлено с этого места (Шаг 4) -->
  <div class="mt-3">
    <a href="{% url 'post_edit' post.slug %}" class="btn btn-sm btn-outline-secondary">Edit</a>
    <a href="{% url 'post_delete' post.slug %}" class="btn btn-sm btn-outline-danger">Delete</a>
  </div>
</div>
{% endblock %}
