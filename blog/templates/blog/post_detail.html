{% extends "blog/base.html" %}
{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>{{ post.title }}</h1>
  
  <!-- 👇 Отображается только если задана категория -->
  {% if post.category %}
    <span class="badge bg-secondary">{{ post.category.name }}</span>
  {% endif %}

  <p class="text-muted mt-2">{{ post.created_at|date:"M d, Y" }}</p>
  <p>{{ post.content }}</p>
</div>
{% endblock %}
